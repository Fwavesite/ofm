<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Producto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .board {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }
        .producto {
            background: #fff;
            border-radius: 8px;
            padding: 1rem;
            width: 200px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }
        .producto h2 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: #444;
        }
        .producto p {
            font-size: 0.9rem;
            color: #666;
        }
        .boton {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background: #4CAF50;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .boton:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <h1>Mi Board de Productos</h1>
    <div class="board">
        <div class="producto">
            <h2>Producto 1</h2>
            <p>Descripción breve del producto 1.</p>
            <a href="#" class="boton">Comprar</a>
        </div>
        <div class="producto">
            <h2>Producto 2</h2>
            <p>Descripción breve del producto 2.</p>
            <a href="#" class="boton">Comprar</a>
        </div>
        <div class="producto">
            <h2>Producto 3</h2>
            <p>Descripción breve del producto 3.</p>
            <a href="#" class="boton">Comprar</a>
        </div>
        <!-- Puedes duplicar este bloque para más productos -->
    </div>
</body>
</html>
